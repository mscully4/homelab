name: torrents

services:
  gluetun:
    container_name: torrents_gluetun
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      # requires a Plus/Unlimited/Visionary plan; gluetun requests the
      # forwarded port itself via Proton's API, no extra key setup needed
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-off}
    ports:
      - '8080:8080' # qBittorrent WebUI, published from gluetun's network namespace
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped
    # gluetun's image ships its own internal healthcheck (VPN connectivity
    # via its port-9999 control server) — no custom healthcheck needed here.

  qbittorrent:
    container_name: torrents_qbittorrent
    image: lscr.io/linuxserver/qbittorrent
    network_mode: 'service:gluetun' # no network of its own — all traffic dies with gluetun (killswitch)
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/config:/config
      - ${DOWNLOADS_LOCATION}:/downloads
    restart: unless-stopped

